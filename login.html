<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | ESKORP V-PASS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
    <div class="text-center mb-8">
      <span class="text-xs font-mono uppercase bg-purple-950 text-purple-300 px-3 py-1 rounded-full border border-purple-800/60">ESKORP / V-PASS</span>
      <h2 class="text-2xl font-bold mt-3 bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">Panel de Control</h2>
      <p class="text-xs text-slate-400 mt-1">Ingresa tus credenciales de organizador</p>
    </div>

    <form id="standaloneLoginForm" onsubmit="handleStandaloneLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Correo Electrónico</label>
        <input type="email" id="loginEmailInput" required placeholder="cliente@eskorp.com" 
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 text-sm">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Contraseña</label>
        <input type="password" id="loginPassInput" required placeholder="••••••••" 
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 text-sm">
      </div>
      
      <div id="standaloneErrorMsg" class="text-red-400 text-xs text-center hidden bg-red-500/10 border border-red-500/20 py-2 rounded">
        Correo o contraseña incorrectos.
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-lg shadow-lg transition-all">
        Iniciar Sesión de Forma Segura
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors">← Volver a la página principal</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function handleStandaloneLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmailInput').value.trim();
      const pass = document.getElementById('loginPassInput').value.trim();
      
      const success = authenticateOrganizer(email, pass);
      if (success) {
        window.location.href = 'panel.html';
      } else {
        document.getElementById('standaloneErrorMsg').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
