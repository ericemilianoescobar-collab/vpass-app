<!-- Lógica de Conexión a Supabase -->
  <script src="./js/supabase-config.js"></script>
  <script>
    const form = document.getElementById('orgLoginForm');
    const errBox = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Evita que la página se recargue en vacío
      
      const email = document.getElementById('orgEmail').value.trim();
      const pass = document.getElementById('orgPass').value.trim();

      errBox.classList.add('hidden');
      submitBtn.innerText = "Verificando en la nube...";
      submitBtn.disabled = true;

      try {
        const res = await window.loginOrganizador(email, pass);

        if (res.success) {
          window.location.href = 'panel.html';
        } else {
          errBox.innerText = res.message;
          errBox.classList.remove('hidden');
          submitBtn.innerText = "Ingresar al Panel";
          submitBtn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        errBox.innerText = "Error de conexión con Supabase. Revisa tus credenciales.";
        errBox.classList.remove('hidden');
        submitBtn.innerText = "Ingresar al Panel";
        submitBtn.disabled = false;
      }
    });
  </script>
