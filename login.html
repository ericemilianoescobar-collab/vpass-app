<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de Organizadores | ESKORP V-PASS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
    <div class="text-center mb-8">
      <span class="text-xs font-mono uppercase bg-purple-900/50 text-purple-300 px-3 py-1 rounded-full border border-purple-700/50">ESKORP / V-PASS</span>
      <h2 class="text-2xl font-bold mt-3 bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">Panel de Organizadores</h2>
      <p class="text-xs text-gray-400 mt-1">Ingresa con tus credenciales corporativas autorizadas</p>
    </div>

    <form id="independentLoginForm" onsubmit="processLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">Correo Electrónico</label>
        <input type="email" id="userEmail" required placeholder="ejemplo@eskorp.com" 
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 text-sm">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">Contraseña</label>
        <input type="password" id="userPassword" required placeholder="••••••••" 
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 text-sm">
      </div>
      
      <div id="loginErrorMsg" class="text-red-400 text-xs text-center hidden bg-red-500/10 border border-red-500/20 py-2 rounded">
        Credenciales incorrectas. Verifica tu correo o contraseña.
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-lg shadow-lg transition-all duration-200">
        Iniciar Sesión de Forma Segura
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-gray-400 hover:text-white transition-colors">← Volver a la página principal</a>
    </div>
  </div>

  <script>
    // Base de datos simulada de organizadores autorizados (Aquí puedes agregar o crear nuevos correos y contraseñas reales)
    const authorizedOrganizers = [
      {
        email: "admin@eskorp.com",
        password: "Admin2026Password*",
        name: "Eric Emiliano Escobar (Director General)",
        plan: "Plan Premium Ilimitado (ESKORP / NIX / Luz)"
      },
      {
        email: "organizador@nix.com",
        password: "NixChilcano2026",
        name: "Submarca NIX (Bebidas RTD)",
        plan: "Plan Estándar Activo"
      },
      {
        email: "eventos@luz.com",
        password: "ChocotejasLuz2026",
        name: "Submarca Luz (Confección)",
        plan: "Plan Básico Activo"
      }
    ];

    function processLogin(event) {
      event.preventDefault();
      const emailInput = document.getElementById('userEmail').value.trim();
      const passwordInput = document.getElementById('userPassword').value.trim();
      const errorMsg = document.getElementById('loginErrorMsg');

      // Buscar si el correo y contraseña coinciden en nuestra base de datos autorizada
      const foundOrganizer = authorizedOrganizers.find(org => org.email === emailInput && org.password === passwordInput);

      if (foundOrganizer) {
        // Guardar la sesión activa del organizador específico
        localStorage.setItem('vpass_is_logged', 'true');
        localStorage.setItem('vpass_org_name', foundOrganizer.name);
        localStorage.setItem('vpass_org_plan', foundOrganizer.plan);
        localStorage.setItem('vpass_org_email', foundOrganizer.email);

        // Redirigir al panel de control independiente
        window.location.href = 'panel.html';
      } else {
        errorMsg.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
