<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Organizador | ESKORP V-PASS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
    <div class="text-center">
      <span class="text-xs font-mono text-purple-400 uppercase tracking-widest">Plataforma Cloud</span>
      <h1 class="text-2xl font-bold mt-1">ESKORP V-PASS</h1>
      <p class="text-xs text-slate-400 mt-1">Acceso para Organizadores</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Correo Electrónico</label>
        <input type="email" id="orgEmail" required placeholder="tucorreo@eskorp.com" 
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Contraseña</label>
        <input type="password" id="orgPass" required placeholder="••••••••" 
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500">
      </div>
      <div id="errorMsg" class="text-red-400 text-xs text-center hidden bg-red-500/10 border border-red-500/20 py-2 rounded"></div>
      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-lg shadow-lg text-sm transition-all">
        Ingresar al Panel
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800">
      <a href="validador.html" class="text-xs text-purple-400 hover:text-purple-300 underline font-medium">¿Eres Validador de Puerta? Ingresa aquí</a>
    </div>
  </div>

  <script type="module">
    import { loginOrganizador } from './js/supabase-config.js';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('orgEmail').value.trim();
      const pass = document.getElementById('orgPass').value.trim();
      const errBox = document.getElementById('errorMsg');

      errBox.classList.add('hidden');
      const res = await loginOrganizador(email, pass);

      if (res.success) {
        window.location.href = 'panel.html';
      } else {
        errBox.innerText = res.message;
        errBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
