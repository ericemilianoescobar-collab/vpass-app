<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Organizador | ESKORP V-PASS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-10">

  <!-- Validar seguridad de sesión -->
  <script src="js/auth.js"></script>
  <script>checkSessionOrRedirect();</script>

  <div class="max-w-6xl mx-auto">
    <!-- Cabecera -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8 shadow-lg gap-4">
      <div class="flex items-center space-x-4">
        <div class="bg-purple-600/20 border border-purple-500/40 p-3 rounded-xl">
          <span class="text-xl font-black text-purple-400">V-PASS</span>
        </div>
        <div>
          <h1 class="text-xl font-bold flex items-center gap-2">
            Proyecto: <span class="text-indigo-400 font-mono text-base bg-indigo-950 px-2 py-0.5 rounded border border-indigo-800">ESKORP / V-PASS</span>
          </h1>
          <p class="text-sm text-slate-400">Bienvenido, <span id="orgNameUI" class="text-white font-semibold">Cargando...</span></p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema en Línea
        </span>
        <button onclick="logoutSession()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
          Cerrar Sesión
        </button>
      </div>
    </header>

    <!-- Tarjetas de Planes Activos (Renderizado dinámico basado en los permisos 0/1) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="plansContainerUI">
      <!-- Se inyecta con JavaScript según los planes contratados -->
    </div>

    <!-- Gestión de Eventos -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-lg font-bold">Gestión de Eventos y Accesos QR</h2>
          <p class="text-xs text-slate-400">Controla y edita los eventos vinculados a tu cuenta</p>
        </div>
        <button onclick="alert('Módulo de creación de nuevo evento habilitado para tu cuenta.')" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">
          + Crear Evento
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
              <th class="py-3 px-4">Nombre del Evento</th>
              <th class="py-3 px-4">Ubicación</th>
              <th class="py-3 px-4">Estado</th>
              <th class="py-3 px-4 text-right">Herramientas</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800 text-sm">
            <tr>
              <td class="py-4 px-4 font-semibold">Lanzamiento Oficial NIX & Luz</td>
              <td class="py-4 px-4 text-slate-300">Ayacucho, Huamanga</td>
              <td class="py-4 px-4"><span class="bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full text-xs font-medium border border-emerald-500/20">Programado</span></td>
              <td class="py-4 px-4 text-right">
                <button onclick="alert('Abriendo editor del evento')" class="text-indigo-400 hover:text-indigo-300 font-medium mr-3">Editar</button>
                <button onclick="alert('Abriendo validador de accesos QR')" class="text-purple-400 hover:text-purple-300 font-medium">Validar Accesos</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Cargar nombre del organizador
    document.getElementById('orgNameUI').innerText = localStorage.getItem('vpass_org_name') || 'Organizador General';

    // Leer los planes guardados en la sesión (0 o 1)
    const userPlans = JSON.parse(localStorage.getItem('vpass_plans') || '{"basico":0,"estandار":0,"premium":0}');
    const container = document.getElementById('plansContainerUI');

    let htmlContent = '';

    // Renderizar Plan Básico si está activo (1) o inactivo (0)
    htmlContent += `
      <div class="bg-slate-900 border ${userPlans.basico === 1 ? 'border-purple-500/60 bg-purple-950/10' : 'border-slate-800 opacity-60'} p-6 rounded-2xl relative">
        <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Plan Básico</p>
        <h3 class="text-xl font-bold ${userPlans.basico === 1 ? 'text-purple-400' : 'text-slate-500'}">
          ${userPlans.basico === 1 ? 'Activo (Hasta 500 Asistentes)' : 'No Contratado'}
        </h3>
        <p class="text-xs text-slate-400 mt-2">Validador QR esencial</p>
      </div>
    `;

    // Renderizar Plan Estándar
    htmlContent += `
      <div class="bg-slate-900 border ${userPlans.estandar === 1 ? 'border-indigo-500/60 bg-indigo-950/10' : 'border-slate-800 opacity-60'} p-6 rounded-2xl relative">
        <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Plan Estándar</p>
        <h3 class="text-xl font-bold ${userPlans.estandar === 1 ? 'text-indigo-400' : 'text-slate-500'}">
          ${userPlans.estandar === 1 ? 'Activo (Hasta 2,000 Asistentes)' : 'No Contratado'}
        </h3>
        <p class="text-xs text-slate-400 mt-2">Multidispositivo simultáneo</p>
      </div>
    `;

    // Renderizar Plan Premium
    htmlContent += `
      <div class="bg-slate-900 border ${userPlans.premium === 1 ? 'border-pink-500/60 bg-pink-950/10' : 'border-slate-800 opacity-60'} p-6 rounded-2xl relative">
        <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Plan Premium</p>
        <h3 class="text-xl font-bold ${userPlans.premium === 1 ? 'text-pink-400' : 'text-slate-500'}">
          ${userPlans.premium === 1 ? 'Activo (Ilimitado / Corporativo)' : 'No Contratado'}
        </h3>
        <p class="text-xs text-slate-400 mt-2">Soporte y Submarcas ilimitadas</p>
      </div>
    `;

    container.innerHTML = htmlContent;
  </script>
</body>
</html>
