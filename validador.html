<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador Antifraude | ESKORP V-PASS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Instascan / Librería QR (si la usas) o lector local -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col justify-between selection:bg-purple-500 selection:text-white">

  <!-- Validación estricta de Sesión para Validador -->
  <script>
    const session = JSON.parse(localStorage.getItem('eskorp_session'));
    if (!session || (session.tipo !== 'validador' && session.tipo !== 'organizador')) {
      window.location.href = 'index.html';
    }
  </script>

  <div class="max-w-xl mx-auto space-y-6 w-full">
    <header class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold text-white">Validador de Accesos</h1>
        <p class="text-xs text-slate-400" id="validadorSubtitle">Control Antifraude V-PASS</p>
      </div>
      <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold transition-colors">
        Salir
      </button>
    </header>

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4 text-center">
      <h2 class="text-sm font-bold text-slate-300">Ingrese o escanee el código del ticket</h2>
      
      <div class="space-y-3">
        <input type="text" id="tokenInput" placeholder="Ej. AT-EF-AB12CD34" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center text-sm font-mono text-white focus:outline-none focus:border-purple-500">
        <button onclick="validarTokenManual()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl text-xs transition-all shadow-md">
          🔍 Validar Acceso
        </button>
      </div>

      <div id="resultadoValidacion" class="mt-4 p-4 rounded-xl text-xs font-bold hidden"></div>
    </div>
  </div>

  <script>
    const companyName = session.company_name || session.empresa || "ESKORP";
    document.getElementById('validadorSubtitle').innerText = `Organización: ${companyName}`;

    function validarTokenManual() {
      const token = document.getElementById('tokenInput').value.trim().toUpperCase();
      const res = document.getElementById('resultadoValidacion');
      res.classList.remove('hidden');

      if (!token) {
        res.className = "mt-4 p-4 rounded-xl text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30";
        res.innerText = "⚠️ Por favor ingresa un código de ticket válido.";
        return;
      }

      const listaInvitados = JSON.parse(localStorage.getItem('eskorp_invitados_' + companyName)) || [];
      const invitadoEncontrado = listaInvitados.find(i => i.token.toUpperCase() === token);

      if (invitadoEncontrado) {
        res.className = "mt-4 p-4 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        res.innerText = `✅ ACCESO VÁLIDO: Bienvenido/a ${invitadoEncontrado.guest}`;
      } else {
        res.className = "mt-4 p-4 rounded-xl text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30";
        res.innerText = `❌ ACCESO DENEGADO: El ticket "${token}" no existe o ya fue utilizado.`;
      }
    }

    function logout() {
      localStorage.removeItem('eskorp_session');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
